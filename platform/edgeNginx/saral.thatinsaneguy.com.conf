# Homelab edge nginx — proxy saral.thatinsaneguy.com to in-cluster Ingress (org-style).
# TLS is issued by cert-manager and terminated inside the cluster (ingress-nginx :30443).
#
# Install: sudo homeLabOps/scripts/configureEdgeNginx.sh
# Requires: platform ingress-nginx synced (NodePorts 30080 / 30443)

server {
    listen 80;
    listen [::]:80;
    server_name saral.thatinsaneguy.com;

    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saral.thatinsaneguy.com;

    # Host edge forwards to ingress-nginx HTTPS NodePort (cert-manager cert lives in cluster).
    location / {
        proxy_pass https://127.0.0.1:30443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Placeholder until cert-manager provisions saral-tls — edge needs any cert for nginx to start.
    # configureEdgeNginx.sh swaps these paths if host certbot cert already exists.
    ssl_certificate /etc/letsencrypt/live/saral.thatinsaneguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saral.thatinsaneguy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
