apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkitup-ui
  labels:
    app.kubernetes.io/name: linkitup-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: linkitup-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkitup-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ui
          image: ghcr.io/uttu28/linkitup-ui:latest
          ports:
            - name: http
              containerPort: 9220
          readinessProbe:
            httpGet:
              path: /
              port: 9220
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9220
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
