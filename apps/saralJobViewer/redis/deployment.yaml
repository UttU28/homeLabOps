apiVersion: apps/v1
kind: Deployment
metadata:
  name: saral-redis
  labels:
    app.kubernetes.io/name: saral-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: saral-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saral-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: ghcr.io/uttu28/saral-redis:latest
          ports:
            - name: redis
              containerPort: 9262
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "9262", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "9262", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
