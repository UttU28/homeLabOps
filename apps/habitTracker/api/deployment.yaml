apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-api
  labels:
    app.kubernetes.io/name: habit-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: habit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: habit-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/keeru-srinivas/habit-api:latest
          ports:
            - name: http
              containerPort: 9210
          envFrom:
            - secretRef:
                name: habit-backend-env
          env:
            - name: HABITTRACKER_PORT
              value: "9210"
            - name: DEBUG
              value: "false"
            - name: FIREBASE_CREDENTIALS_PATH
              value: /app/firebase-config.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /app/firebase-config.json
              subPath: firebase-config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9210
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9210
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: habit-firebase-credentials
